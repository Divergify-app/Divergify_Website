<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takota — Divergify AI Companion</title>
  <meta name="description" content="Takota is a calm, grounded AI companion built for neurodivergent people. No toxic positivity. No clinical labels. Just presence." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0D1538;
      --periwinkle: #141B3D;
      --periwinkle-mid: #252D54;
      --gold: #C9A84C;
      --text: #E8EAF0;
      --muted: #6B7294;
      --border: #252D54;
    }
    html, body {
      height: 100%;
      background: var(--navy);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 32px;
    }
    .hero {
      text-align: center;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .hero-mark {
      font-size: 48px;
      color: var(--gold);
      line-height: 1;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .hero p {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
    }
    .chat-card {
      width: 100%;
      max-width: 480px;
      background: var(--periwinkle);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 520px;
    }
    .chat-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--navy);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .chat-header-text .name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .chat-header-text .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg {
      max-width: 88%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--gold);
      color: var(--navy);
      font-weight: 500;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--navy);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .msg.typing {
      align-self: flex-start;
      background: var(--navy);
      color: var(--muted);
      border: 1px solid var(--border);
      font-style: italic;
    }
    .chat-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .chat-input {
      flex: 1;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 88px;
      outline: none;
      line-height: 1.4;
    }
    .chat-input::placeholder { color: var(--muted); }
    .chat-input:focus { border-color: #C9A84C44; }
    .chat-send {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--gold);
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--navy);
      font-weight: 700;
      flex-shrink: 0;
      transition: opacity 0.1s;
    }
    .chat-send:disabled { background: var(--periwinkle-mid); color: var(--muted); cursor: default; }
    .chat-send:not(:disabled):hover { opacity: 0.85; }
    .disclaimer {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 0 16px 12px;
    }
    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-mark">✦</div>
      <h1>Takota</h1>
      <p>A calm, grounded AI companion built for neurodivergent people. No toxic positivity. No clinical labels. Just presence.</p>
    </div>

    <div class="chat-card">
      <div class="chat-header">
        <div class="chat-avatar">✦</div>
        <div class="chat-header-text">
          <div class="name">Takota</div>
          <div class="sub">AI companion · Divergify</div>
        </div>
      </div>
      <div class="chat-messages" id="messages" role="log" aria-live="polite">
        <div class="msg assistant">Hey. I'm Takota. What's on your mind?</div>
      </div>
      <div class="chat-footer">
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Tell me what's happening..."
          rows="1"
          maxlength="500"
          aria-label="Message Takota"
        ></textarea>
        <button class="chat-send" id="chat-send" disabled aria-label="Send">→</button>
      </div>
      <div class="disclaimer">Not medical advice. Does not diagnose or treat any condition.</div>
    </div>

    <a href="/" class="back-link">← Back to Divergify</a>
  </div>

  <script>
    (function () {
      const API_BASE = 'https://api.divergify.app';
      const STORAGE_KEY = 'takota_page_history';
      let history = [];
      let isLoading = false;

      try {
        const saved = sessionStorage.getItem(STORAGE_KEY);
        if (saved) {
          history = JSON.parse(saved);
          history.forEach((m) => appendMsg(m.role, m.content, false));
        }
      } catch (_) {}

      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const messages = document.getElementById('messages');

      input.addEventListener('input', () => {
        sendBtn.disabled = !input.value.trim() || isLoading;
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 88) + 'px';
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) send();
        }
      });

      sendBtn.addEventListener('click', send);

      function appendMsg(role, text, save) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        if (save !== false) {
          history.push({ role, content: text });
          if (history.length > 10) history = history.slice(-10);
          try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (_) {}
        }
      }

      function showTyping() {
        const div = document.createElement('div');
        div.className = 'msg typing';
        div.id = 'typing-indicator';
        div.textContent = 'Thinking…';
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function removeTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
      }

      async function send() {
        const text = input.value.trim();
        if (!text || isLoading) return;
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;
        isLoading = true;
        appendMsg('user', text);
        showTyping();

        try {
          const payload = {
            '0': {
              json: {
                message: text,
                history: history.slice(-6).filter((m) => !(m.role === 'user' && m.content === text)),
              },
            },
          };
          const res = await fetch(API_BASE + '/api/trpc/takota.widgetChat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include',
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const reply =
            data?.[0]?.result?.data?.json?.reply ||
            data?.result?.data?.json?.reply ||
            "I'm here. Something went sideways — try again?";
          removeTyping();
          appendMsg('assistant', reply);
        } catch (_) {
          removeTyping();
          appendMsg('assistant', "I'm here. Something went sideways on my end — try again?");
        } finally {
          isLoading = false;
          sendBtn.disabled = !input.value.trim();
        }
      }
    })();
  </script>
</body>
</html>
