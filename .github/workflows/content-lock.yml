name: Content Lock

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-content-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Field Notes content lock
        run: python3 scripts/verify_content_lock.py
