name: Takota behavior checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  takota-dom-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:takota
